name: Bug report
description: Report a reproducible problem with Lumivent
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before continuing, check the
        [troubleshooting guide](https://github.com/lcsssilva/lumivent/blob/main/guide/troubleshooting.md)
        and search the existing issues.

        Do not paste personal data, keys, full memory dumps or third-party
        proprietary files.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, in one or two sentences?
      placeholder: When I open the Lighting page, the app closes without a message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest path to the problem.
      placeholder: |
        1. Open Lumivent
        2. Go to Iluminação (Lighting)
        3. Select the AL V2 hub
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Lumivent version
      description: Output of `pacman -Q lumivent` or the version shown in the app.
      placeholder: lumivent 1.0.0-1
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, version and kernel.
      placeholder: CachyOS, kernel 6.16.7, x86_64
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - .pkg.tar.zst package from a release
        - makepkg from source
        - Development bundle (flutter build)
        - Other
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware
      description: Motherboard, hub/fans, memory, GPU and SSDs involved.
      placeholder: B650E AORUS, AL V2 hub, 2x Fury Beast, RX 9060 XT
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: |
        Run the app from a terminal and paste the output. Also include the
        **Configurações → Permissões e sistema** (Settings → Permissions and
        system) screen, as text or a screenshot.
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration (optional)
      description: |
        If the problem involves fans or lighting, paste the relevant part of
        `config.json`. Remove anything you do not want to make public.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched the issues and the documentation before opening this report.
          required: true
        - label: I did not include third-party proprietary files, effects or binaries.
          required: true
        - label: I removed personal data and secrets from the text and the logs.
          required: true
