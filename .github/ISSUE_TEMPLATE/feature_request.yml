name: Feature request
description: Suggest a feature or an improvement for Lumivent
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Describe the problem before the solution: it helps
        to weigh alternatives and the impact on supported hardware.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What difficulty or limitation did you run into?
      placeholder: I can't follow the fan curve and the temperature on the same chart.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you picture the behavior?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other apps, workarounds or solutions you have already tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Monitoring
        - Fans
        - Lighting / effects
        - System integration
        - Configuration / import
        - Interface
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware involved (if applicable)
      description: Motherboard, hub, fans, memory, GPU or SSD model.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links or implementation details.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched the issues and the documentation before opening this request.
          required: true
        - label: The request does not depend on redistributing proprietary code, effects or assets.
          required: true
